name: Build BYD Overdrive APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release (requires main branch)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode permanent release keystore
        # RELEASE_KEYSTORE_BASE64 holds the PKCS12 keystore generated once and stored
        # as a GitHub Secret. Decoding it here guarantees every CI run signs with the
        # EXACT same certificate, so `pm install -r` upgrades work without uninstalling.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded: $(stat -c%s app/release.keystore) bytes"
          mkdir -p ~/.android
          cp app/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug: keeps debug flags (no R8 shrink) but now uses our fixed keystore
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -1 | sed -E 's/.*[?]: ([0-9]+).*/\1/')
          echo "Building OverDrive version: $VERSION (versionCode: $VERSION_CODE)"
          ./gradlew assembleDebug -PoverdriveVersionName="$VERSION" -PoverdriveVersionCode="$VERSION_CODE" -PoverdriveUpdateChannel=alpha --stacktrace --no-daemon

      - name: Verify APK signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Verifying: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS_OUTPUT"

          EXPECTED="adc52cfa28f7b9ea723f11dae874639eb1bddc6bacadb2daf18a90435dc8e293"
          if echo "$CERTS_OUTPUT" | grep -qi "$EXPECTED"; then
            echo "✅ Verified: APK signature matches permanent keystore ($EXPECTED)!"
          else
            echo "❌ Fingerprint mismatch! Expected $EXPECTED not found in apksigner output."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Found built APK ($VERSION): $APK_FILE"
          cp "$APK_FILE" "release-assets/Overdrive-v${VERSION}-cn-sec.apk"
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Signed-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.publish_release == 'true')
        with:
          tag_name: "v${{ env.APP_VERSION }}-cn-sec"
          name: "OverDrive v${{ env.APP_VERSION }} - 后台 Binder 死锁防护、硬编码器超时清理、采样降负与版本显示修复"
          body: |
            ## OverDrive v${{ env.APP_VERSION }} 定制版（实车验证通过）

            ### 🛡️ 1. 核心稳定性与性能修复 (P0)
            - **防止 MediaScanner 广播风暴与 Shell 阻塞耗尽 `system_server` Binder 池 (`StorageManager` / `SentryDaemon`，PR #881)**：新增单线程 `mediaScanExecutor` 串行执行录像媒体索引、`5s` 子进程超时强杀与并发流排空、启动补扫 `50` 文件上限与连续 `2` 次超时熔断及单调递增水印；`SentryDaemon.execShell` 增加 `15s` 超时强杀与流排空，定位服务重启超时提前短路；
            - **硬件编码器初始化超时资源清理与中断传播 (`HardwareEventRecorderGpu` / `LateResourceHandoff`，PR #908 / #917 / #919)**：引入 `LateResourceHandoff` 原子交接释放超时后晚到的 `MediaCodec` / `Surface`，补齐 `start` 超时漏放的 `inputSurface`，正确传播 `InterruptedException` 避免误触发编解码回退；
            - **守护进程 `getApplicationContext()` 防空指针 (`AccSentryDaemon` / `DaemonBootstrap` / `SentryDaemon`，PR #906)**：当底层返回 `null` 时回退 `this`，防止 BYD 原生 SDK 监听注册空指针导致 ACC-OFF 检出或哨兵异常；
            - **`/proc/stat` 无分配缓冲采样 (`PerformanceMonitor`，PR #904)**：改用 `BufferedReader` 与 `parseAggregateCpuTimes()` 原地解析，消灭 `RandomAccessFile` 逐字节读取与正则 `split` 临时对象分配；
            - **车机内嵌 WebView 注入修复与地图界面优化 (`WebViewFragment` / `live-view.html`，PR #918)**：改按 `EMBED_MARKER` 判重修复页面 CSS 含 `data-android-embed` 时跳过注入的缺陷，车机内嵌模式下自动隐藏“我的位置”与距离胶囊；
            - **仪表盘 `leaflet.js` 加载顺序优化 (`index.html`，PR #892)**：将 `leaflet.js` 移至 `map.js` 正前方，避免阻塞首屏解析并消除脚本执行顺序竞态。

            ### 🔧 2. 基础防御修复与中文版优化
            - **修复 ADB 覆盖升级后 Web 面板版本号滞留旧值 (`AppUpdater`)**：当 `/data/local/tmp/overdrive_version` 中持久化版本号低于当前运行 APK 的 `BuildConfig.VERSION_NAME` 时，自动忽略旧缓存并回退显示真实运行版本；
            - **GPS 无效坐标过滤与跨 Geohash 边界缓存清理 (`GeoCoordinates` / `GeoCache` / `Geohash` / `GeocodingResolver` / `GeoBackfillSweep` / `GeoSnapshot`，PR #896 / #897)**：屏蔽 `(0,0)` 与越界坐标污染逆地理缓存，修复安全地点改名后跨 Geohash 前缀边界残留旧地名；
            - **基础健壮性与区域无关解析 (`FileUtils` / `app-collapse.js` / `AvmByteCallbackProbe` / `CameraDaemon` / `QualitySettingsApiHandler` / `StreamingApiHandler` / `GpuPipelineConfig`，PR #895 / #891 / #890 / #903)**：增强目录创建校验、避免折叠卡片内控件按键冒泡误折叠、限定 AVM 探测编码器 EOS 排空 `2s` 上限，以及画质/编码枚举解析统一传入 `Locale.ROOT`。

            ### 🔒 3. 门禁验证与升级说明
            - 已通过 `scripts/i18n_check.py` 双端 i18n 门禁检查（`errors=0`）、JS 语法校验与源码契约检查，并已在实车 DiLink 3.0（Android 10）完成覆盖安装与三大守护进程平稳运行验证；
            - 沿用独立车机永久密钥签名（SHA-256 指纹已锁死校验），支持应用内检查更新直接覆盖，或通过两步法 `adb push` + `pm install -r` 无损升级。
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

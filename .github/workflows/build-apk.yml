name: Build BYD Overdrive APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode permanent release keystore
        # RELEASE_KEYSTORE_BASE64 holds the PKCS12 keystore generated once and stored
        # as a GitHub Secret. Decoding it here guarantees every CI run signs with the
        # EXACT same certificate, so `pm install -r` upgrades work without uninstalling.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded: $(stat -c%s app/release.keystore) bytes"
          mkdir -p ~/.android
          cp app/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug: keeps debug flags (no R8 shrink) but now uses our fixed keystore
        # instead of the random per-runner debug keystore → consistent fingerprint every run.
        run: ./gradlew assembleDebug -PoverdriveVersionName=49.9.5 -PoverdriveVersionCode=4995 -PoverdriveUpdateChannel=alpha --stacktrace --no-daemon

      - name: Verify APK signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Verifying: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS_OUTPUT"

          EXPECTED="adc52cfa28f7b9ea723f11dae874639eb1bddc6bacadb2daf18a90435dc8e293"
          if echo "$CERTS_OUTPUT" | grep -qi "$EXPECTED"; then
            echo "✅ Verified: APK signature matches permanent keystore ($EXPECTED)!"
          else
            echo "❌ Fingerprint mismatch! Expected $EXPECTED not found in apksigner output."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found built APK: $APK_FILE"
          cp "$APK_FILE" release-assets/Overdrive-v49.9.5-cn-sec.apk
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Signed-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v49.9.5-cn-sec
          name: OverDrive v49.9.5 - 驻车动态 GPS 降频与自愈自校准闭环
          body: |
            ## OverDrive v49.9.5 能耗优化与状态自愈版

            ### 🛰️ 驻车动态 GPS 降频与基带深度节能 (v49.9.5)
            - **驻车自动释放高精 GPS 监听**：`LocationSidecarService` 引入动态 ACC 监听与状态切换。车辆熄火驻车（ACC OFF）时，注销 1s/0m 的高频 `GPS_PROVIDER`，彻底解除对高通 GNSS 射频基带的硬性唤醒；
            - **网络低功耗守候与被动定位**：驻车期间仅保留低功耗 `NETWORK_PROVIDER`（60s / 10m 移动阈值），在保证车辆位移/拖车防盗感应的同时，杜绝电量虚耗；
            - **TCP IPC 跨进程通信降频**：驻车状态下 GPS-TCP 发送频率从原先的 1 秒/次（3600次/小时）骤降至 5 分钟/次（12次/小时），减少 99.7% 的静止 IPC 与线程唤醒开销；
            - **状态自愈与异步对齐闭环 (v49.9.5 新增)**：在服务启动与定时上报时，异步核对 CameraDaemon 本地 `/status` 电源权威状态，解决应用重启/更新未触发点火广播时的保守误判，确保 100% 自动收敛至驻车低功耗模式；
            - **行车瞬间极速恢复**：车辆启动（ACC ON / IGN ON）瞬间毫秒级恢复 1s/0m 高精度双通道定位与高频遥测。

            ### 🌐 比亚迪云端 MQTT 失败指数退避 (v49.9.5)
            - **长周期重试退避上限**：将 `BydCloudMqttSubscriber` 的重连上限由 300 秒（5 分钟）放宽至 1800 秒（30 分钟），避免因网络或证书异常导致的频繁唤醒无线通信模块与 CPU 轮询。

            ### 🌡️ 核心遥测常驻与行车双录/驻车单录机制
            - 包含 v49.9.3 车外温度传感器常驻发现与缓存回退。
            - 适配 OEM Dashcam 驻车单录策略，释放独立 OpenGL ES 上下文与 MediaCodec 编码器。
          files: release-assets/Overdrive-v49.9.5-cn-sec.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build BYD Overdrive APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode permanent release keystore
        # RELEASE_KEYSTORE_BASE64 holds the PKCS12 keystore generated once and stored
        # as a GitHub Secret. Decoding it here guarantees every CI run signs with the
        # EXACT same certificate, so `pm install -r` upgrades work without uninstalling.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded: $(stat -c%s app/release.keystore) bytes"
          mkdir -p ~/.android
          cp app/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug: keeps debug flags (no R8 shrink) but now uses our fixed keystore
        # instead of the random per-runner debug keystore → consistent fingerprint every run.
        run: ./gradlew assembleDebug -PoverdriveVersionName=49.9.2 -PoverdriveVersionCode=4992 -PoverdriveUpdateChannel=alpha --stacktrace --no-daemon

      - name: Verify APK signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Verifying: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS_OUTPUT"

          EXPECTED="adc52cfa28f7b9ea723f11dae874639eb1bddc6bacadb2daf18a90435dc8e293"
          if echo "$CERTS_OUTPUT" | grep -qi "$EXPECTED"; then
            echo "✅ Verified: APK signature matches permanent keystore ($EXPECTED)!"
          else
            echo "❌ Fingerprint mismatch! Expected $EXPECTED not found in apksigner output."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found built APK: $APK_FILE"
          cp "$APK_FILE" release-assets/Overdrive-v49.9.2-cn-sec.apk
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Signed-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v49.9.2-cn-sec
          name: OverDrive v49.9.2 - 行程防抖延长与熄火 Webhook 优化版
          body: |
            ## OverDrive v49.9.2 行程防抖延长与熄火 Webhook 优化版

            ### 🚗 行程判定防抖延长与熄火自动推送 (v49.9.2)
            - **高速服务区休息不中断行程**：将挂入 P 档且静止等待判定行程结束的防抖时长由 120 秒延长至 30 分钟。服务区挂 P 档开空调休息（不熄火）半小时内，切回 D 档即可继续合并为同一次完整行程，杜绝长途行程被频繁截断拆分
            - **行程结束车熄火自动推送 Webhook**：下电熄火（ACC OFF）瞬间自动结算本次行程能耗、里程、均速、驾驶评分并发送卡片报告到企业微信

            ### 📢 哨兵 Webhook 推送去重与综合合并 (Scheme A)
            - **告别连续刷屏**：将原先动检起始预警、录像结束汇总、抓拍图 3 条连续消息精简合并为 **1 条全信息综合卡片 + 1 张高清现场抓拍图**
            - **综合汇总卡片升级**：单条消息囊括事件等级（Notice/Alert/Critical）、最高检测目标、置信度百分比、触发摄像头方位、视频录像文件名以及精准触发时间
            - **动检即时预警开关**：Web 界面新增“动检即时预警”开关，默认关闭；若需要初始动检即刻报警，用户可在通知设置页随时一键重新启用

            ### 🇨🇳 原生中文零延迟首屏 (Native Chinese First Paint)
            - **彻底消除 FOUC 英文闪烁**：全量 26 个 Web 页面模板、导航侧边栏、状态栏与核心组件预置纯正简体中文，毫秒级直出中文首屏，告别“先英文后转中文”的加载体验
            - **默认中文环境与浏览器语言精准匹配**：`core.js` 默认语言变更为 `zh-CN`，智能匹配浏览器语言偏好，多语言切换能力完整保留

            ### 🛡️ 核心安全加固
            - **阻断同机网页跨源开锁 (C3)**：敏感车控与备份接口收紧 loopback 信任，必须验证有效 JWT，防车机浏览器恶意网页 CSRF 开锁与凭证窃取
            - **JS Bridge 强制隔离 (H4)**：同步请求限制仅允许本地 `127.0.0.1` 访问，禁止向外部第三方域名注入 Session Cookie
            - **暴力破解防护 (H2)**：收紧 `X-Forwarded-For` 采信范围，防伪造来源绕过登录接口频次限制
            - **供应链完整性校验 (H1)**：OpenH264 原生库下载升级为 HTTPS，构建期强制匹配固定 SHA-256 指纹

            ### ⚡ 性能与车载低功耗优化
            - **WakeLock 6小时安全租约与心跳续租 (P3)**：守护进程心跳与状态流转自动续约，正常工作永不断连；彻底杜绝死锁崩溃导致小电瓶耗尽趴窝
            - **WebView 退后台自动挂起轮询 (P1)**：中控屏熄屏或切后台时即刻暂停 3s/5s 密集前端轮询，大幅降低 CPU 负载与挂夜发热
            - **日志批量定时 Flush (P2)**：改用 8KB 缓冲区与 2.5s 定时批量刷盘，减少 90%+ 频繁小 IO，大幅保护车机板载 eMMC 闪存寿命
            - **消除线程与连接池泄漏 (P10)**：天气接口 OkHttpClient 改为单例复用，消除长期运行内存隐患
            - **i18n 多语言内存缓存 (P12)**：ConcurrentHashMap 缓存语言包，页面切换响应更加轻快
            - **首屏非阻塞脚本加载 (P4)**：app-shell 与 leaflet 脚本增加 `defer`，缩短弱算力车机首屏渲染耗时

            ### 💎 本项目深度特性（持续保留）
            - **企业微信群机器人推送**：国内免代理直连，告警、截图、通知全量直推
            - **国内比亚迪云深度适配**：支持手机号登录、海洋网/王朝网、授权车主账号与远程唤醒
            - **全量简体中文本地化精校**：严格遵循专业汽车与车机术语规范，消灭机翻
            - **固化签名证书**：签名证书完全保持一致，支持车机 `pm install -r` 直接无缝覆盖升级，无需卸载
          files: release-assets/Overdrive-v49.9.2-cn-sec.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build BYD Overdrive APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode permanent release keystore
        # RELEASE_KEYSTORE_BASE64 holds the PKCS12 keystore generated once and stored
        # as a GitHub Secret. Decoding it here guarantees every CI run signs with the
        # EXACT same certificate, so `pm install -r` upgrades work without uninstalling.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded: $(stat -c%s app/release.keystore) bytes"
          mkdir -p ~/.android
          cp app/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug: keeps debug flags (no R8 shrink) but now uses our fixed keystore
        # instead of the random per-runner debug keystore → consistent fingerprint every run.
        run: ./gradlew assembleDebug -PoverdriveVersionName=49.9.3 -PoverdriveVersionCode=4993 -PoverdriveUpdateChannel=alpha --stacktrace --no-daemon

      - name: Verify APK signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Verifying: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS_OUTPUT"

          EXPECTED="adc52cfa28f7b9ea723f11dae874639eb1bddc6bacadb2daf18a90435dc8e293"
          if echo "$CERTS_OUTPUT" | grep -qi "$EXPECTED"; then
            echo "✅ Verified: APK signature matches permanent keystore ($EXPECTED)!"
          else
            echo "❌ Fingerprint mismatch! Expected $EXPECTED not found in apksigner output."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found built APK: $APK_FILE"
          cp "$APK_FILE" release-assets/Overdrive-v49.9.3-cn-sec.apk
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Signed-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v49.9.3-cn-sec
          name: OverDrive v49.9.3 - 修复 MQTT 车外温度传感器熄火发现遗漏
          body: |
            ## OverDrive v49.9.3 核心修复版

            ### 🌡️ 修复 MQTT 车外温度传感器熄火启动遗漏 (v49.9.3)
            - **核心遥测常驻发现机制**：引入 `HomeAssistantDiscovery.CORE_KEYS`，确保 `ext_temp`（车外温度）等核心遥测字段在车机熄火状态（ACC OFF）冷启动时依然常驻发布在 HA 设备发现组件清单（cmps）中，彻底杜绝传感器被判定为不支持而丢失/孤立。
            - **车外温度末次有效值缓存与天气回退**：`MqttConnectionManager` 增加 `lastOutsideTempC` 内存缓存，在熄火停泊仪表盘未回传期间复用末次已知车况温度；冷启动初次无数据时接入天气接口缓存兜底，确保遥测流平稳连续。
            - **保持实体 ID 与唯一标识一致性**：自动匹配 HA 已有实体的 unique_id，无缝衔接历史数据与卡片配置。

            ### 🚗 行程判定防抖延长与熄火自动推送 (v49.9.2 持续特性)
            - **高速服务区休息不中断行程**：将挂入 P 档且静止等待判定行程结束的防抖时长延长至 30 分钟。服务区挂 P 档开空调休息（不熄火）半小时内，切回 D 档即可继续合并为同一次完整行程，杜绝长途行程被频繁截断拆分。
            - **行程结束车熄火自动推送 Webhook**：下电熄火（ACC OFF）瞬间自动结算本次行程能耗、里程、均速、驾驶评分并发送卡片报告到企业微信。

            ### 📢 哨兵 Webhook 推送去重与综合合并 (Scheme A)
            - **单条全信息综合卡片 + 现场大图**：将动检起始预警、录像结束汇总、抓拍图合并为 1 条综合卡片 + 1 张高清现场大图。
            - **动检即时预警开关**：Web 界面支持开关“动检即时预警”。

            ### 🇨🇳 原生中文零延迟首屏 (Native Chinese First Paint)
            - **彻底消除 FOUC 英文闪烁**：全量 26 个 Web 页面模板预置纯正简体中文，毫秒级直出。

            ### 🛡️ 核心安全加固与车载低功耗优化
            - **阻断跨源开锁 (C3) 与 JS Bridge 限制 (H4)**
            - **WakeLock 6小时安全租约与心跳续租 (P3)**
            - **WebView 退后台自动挂起轮询 (P1)**
            - **日志批量定时 Flush 8KB 缓存 (P2)**
            - **固化签名证书**：支持车机 `pm install -r` 直接无缝覆盖升级，无需卸载。
          files: release-assets/Overdrive-v49.9.3-cn-sec.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

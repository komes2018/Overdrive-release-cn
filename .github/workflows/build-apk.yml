name: Build BYD Overdrive APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release (requires main branch)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode permanent release keystore
        # RELEASE_KEYSTORE_BASE64 holds the PKCS12 keystore generated once and stored
        # as a GitHub Secret. Decoding it here guarantees every CI run signs with the
        # EXACT same certificate, so `pm install -r` upgrades work without uninstalling.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded: $(stat -c%s app/release.keystore) bytes"
          mkdir -p ~/.android
          cp app/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug: keeps debug flags (no R8 shrink) but now uses our fixed keystore
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -1 | sed -E 's/.*[?]: ([0-9]+).*/\1/')
          echo "Building OverDrive version: $VERSION (versionCode: $VERSION_CODE)"
          ./gradlew assembleDebug -PoverdriveVersionName="$VERSION" -PoverdriveVersionCode="$VERSION_CODE" -PoverdriveUpdateChannel=alpha --stacktrace --no-daemon

      - name: Verify APK signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Verifying: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS_OUTPUT"

          EXPECTED="adc52cfa28f7b9ea723f11dae874639eb1bddc6bacadb2daf18a90435dc8e293"
          if echo "$CERTS_OUTPUT" | grep -qi "$EXPECTED"; then
            echo "✅ Verified: APK signature matches permanent keystore ($EXPECTED)!"
          else
            echo "❌ Fingerprint mismatch! Expected $EXPECTED not found in apksigner output."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Found built APK ($VERSION): $APK_FILE"
          cp "$APK_FILE" "release-assets/Overdrive-v${VERSION}-cn-sec.apk"
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Signed-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.publish_release == 'true')
        with:
          tag_name: "v${{ env.APP_VERSION }}-cn-sec"
          name: "OverDrive v${{ env.APP_VERSION }} - 通知导航栏入口、车辆设置独立分栏、驻车耗电展示、强动检触发与动物时间轴修正"
          body: |
            ## OverDrive v${{ env.APP_VERSION }} 定制版（实车与 Web 端全链路验证通过）

            ### 🚀 1. 核心功能与体验升级 (P1 功能包)
            - **原生侧边栏新增「通知」入口 (`MainActivity` / `NavigationRailCatalog` / `nav_graph`，PR #910)**：在横竖屏侧边栏系统分组中新增「通知」直达入口（加载 `/notifications`），同步补全 `values`、`values-zh-rCN` 与镜像 `values-zh` 中文资源；
            - **通知页独立「车辆设置」底栏分页并保留企业微信直推 (`notifications.html` / `zh-CN.json`，PR #909)**：将车辆布局（左/右舵）与轮胎压力限制归纳至独立 `车辆设置` 分页，完整保留国内定制的 `企业微信 / Webhook` 分页，支持 `#tyreLimitsSection` 等深链直达自动切页与滚动定位；
            - **Web 仪表盘 Hero 驻车耗电展示 (`index.html` / `zh-CN.json`，PR #893)**：在仪表盘副标题下方新增驻车期间耗电显示（优先读取 `/api/parking/current` 活跃驻车能耗，未开启或返车后回退 `/api/performance/parking-delta?maxAgeHours=72`），严格兼容车机 ES5 运行环境；
            - **AI 加载时遵守「强动检触发录像」开关 (`SurveillanceEngineGpu`，PR #922)**：在保留国内版持续动检 `!timeoutExpired` 兜底触发的前提下引入 `!salienceExempts` 豁免，主动开启强动检后可在 AI 在线期间即时放行触发录像；
            - **按片段帧证据修正动物时间轴闪跳 (`EventTimelineCollector` / `SurveillanceEngineGpu` / `EventTimelineView` / `VideoPlayerFragment`，PR #861)**：用每片段 `AnimalFrameEvidence` 状态机替代基于 Actor 快照的事后修正，贯穿预录环形缓冲并对齐 320×240 跨象限坐标；补充 `${it}动物` 播放器图例并复用 `Path` 对象避免绘制内存抖动。

            ### 🔒 2. 门禁验证与升级说明
            - 已通过 `scripts/i18n_check.py` 双端 i18n 门禁检查（`errors=0`）、全量 ES5 脚本语法检查与源码契约检查；
            - 已在实车 DiLink 3.0（Android 10）与 Web 端（直连车机 + 飞牛网桥 `8088`）完成安装、三大守护进程自愈、登录及全部 P1 页面功能实测；
            - 沿用独立车机永久密钥签名（SHA-256 指纹已锁死校验），支持应用内检查更新直接覆盖，或通过两步法 `adb push` + `pm install -r` 无损升级。
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build BYD Overdrive APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode permanent release keystore
        # RELEASE_KEYSTORE_BASE64 holds the PKCS12 keystore generated once and stored
        # as a GitHub Secret. Decoding it here guarantees every CI run signs with the
        # EXACT same certificate, so `pm install -r` upgrades work without uninstalling.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded: $(stat -c%s app/release.keystore) bytes"
          mkdir -p ~/.android
          cp app/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug: keeps debug flags (no R8 shrink) but now uses our fixed keystore
        # instead of the random per-runner debug keystore → consistent fingerprint every run.
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Verifying: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS_OUTPUT"

          EXPECTED="adc52cfa28f7b9ea723f11dae874639eb1bddc6bacadb2daf18a90435dc8e293"
          if echo "$CERTS_OUTPUT" | grep -qi "$EXPECTED"; then
            echo "✅ Verified: APK signature matches permanent keystore ($EXPECTED)!"
          else
            echo "❌ Fingerprint mismatch! Expected $EXPECTED not found in apksigner output."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found built APK: $APK_FILE"
          cp "$APK_FILE" release-assets/Overdrive-v48.19-cn-sec.apk
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Signed-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v48.19-cn-sec
          name: OverDrive v48.19 - 中文深度汉化与安全加固版
          body: |
            ## OverDrive v48.19 中文深度精校与安全加固版

            ### 🚀 本次更新亮点

            - **企业微信群机器人推送（国内直连，无需代理）**：
              - 全新 `WeComNotifier` + `WeComSink`，完整覆盖车→手机通知场景
              - 哨兵检测到人/车/动物：实时 Markdown 告警 + 摄像头方向 + 置信度
              - 录像完成通知 + Hero 截图 Base64 直接推送到群（≤2MB）
              - 隧道 URL 更新时自动推送可点击链接
              - 充电故障、胎压告警、低电量、进程崩溃等 WARN/CRITICAL 事件全覆盖
              - 配置极简：`echo "webhook_url=你的企微机器人地址" > /data/local/tmp/wecom_config.properties`
              - 热更新：修改配置文件即刻生效，无需重新编译

            - **仪表盘汉化深度精校**：
              - "置信度" → "预估区间"（续航预估区间显示）
              - "功率: 开/关" → "整车电源: 开/关"
              - "039 穷人" → "0–39 较差"（驾驶评分区间）
              - "放心." / "热情" → "平稳" / "激烈"（驾驶风格）
              - "希利" → "丘陵起伏"（路段坡度特征）
              - 续航对比栏 "车辆" → "原车表显"

            - **🔐 签名证书永久固定**：
              - 所有云端编译使用同一固定证书，支持车机直接 `pm install -r` 覆盖升级，无需卸载重装。
              - 证书指纹 (SHA-256): `AD:C5:2C:FA:28:F7:B9:EA:72:3F:11:DA:E8:74:63:9E:B1:BD:DC:6B:AC:AD:B2:DA:F1:8A:90:43:5D:C8:E2:93`

            ### 📝 配置说明（企微推送）
            ```bash
            adb shell "echo 'webhook_url=https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=你的KEY' \
                > /data/local/tmp/wecom_config.properties"
            ```
          files: release-assets/Overdrive-v48.19-cn-sec.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

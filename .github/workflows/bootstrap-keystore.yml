name: Bootstrap - Generate Stable JKS Keystore (run once)

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Generate stable JKS with keytool
        run: |
          keytool -genkeypair \
            -alias overdrive-release \
            -keypass overdrive2026 \
            -keystore /tmp/overdrive-release.jks \
            -storepass overdrive2026 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -dname "CN=Overdrive BYD, O=BYD Overdrive CN, C=CN" \
            -storetype JKS \
            -noprompt
          
          echo "=== JKS generated, size: $(stat -c%s /tmp/overdrive-release.jks) bytes ==="
          
          # Print fingerprint
          keytool -list -keystore /tmp/overdrive-release.jks \
            -storepass overdrive2026 -alias overdrive-release -v 2>&1 | \
            grep -E "SHA256:|SHA1:|MD5:"
          
          # Output base64 (copy this into RELEASE_KEYSTORE_BASE64 secret)
          echo "=== BASE64 START ==="
          base64 -w 0 /tmp/overdrive-release.jks
          echo ""
          echo "=== BASE64 END ==="
